# Voyager interactive site (static Astro build). Installed as
# /etc/nginx/sites-available/voyager.vazac.dev, symlinked into sites-enabled.
proxy_cache_path /var/cache/nginx/voyager-dsn levels=1 keys_zone=voyager_dsn:1m max_size=10m inactive=10m use_temp_path=off;

server {
	listen 80;
	listen [::]:80;
	server_name voyager.vazac.dev;

	location /.well-known/acme-challenge/ {
		root /var/www/certbot;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name voyager.vazac.dev;

	root /var/www/apps/voyager.vazac.dev;
	index index.html;
	error_page 404 /404.html;

	ssl_certificate /etc/letsencrypt/live/voyager.vazac.dev/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/voyager.vazac.dev/privkey.pem;
	include /etc/letsencrypt/options-ssl-nginx.conf;
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

	gzip on;
	gzip_comp_level 6;
	gzip_min_length 1024;
	gzip_vary on;
	gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml model/gltf-binary;

	# script-src and style-src come from the per-page CSP meta tag with hashes (Astro).
	add_header Strict-Transport-Security "max-age=31536000" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
	add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

	location / {
		try_files $uri $uri/ =404;
		add_header Cache-Control "no-cache" always;
		add_header Strict-Transport-Security "max-age=31536000" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "DENY" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
		add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
	}

	# Hashed build assets never change.
	location /_astro/ {
		expires 1y;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		add_header X-Content-Type-Options "nosniff" always;
	}

	location ~ ^/(images|models)/ {
		expires 30d;
		add_header X-Content-Type-Options "nosniff" always;
	}

	location /data/ {
		expires 1h;
		add_header X-Content-Type-Options "nosniff" always;
	}

	location = /health {
		default_type application/json;
		try_files /health.json =404;
	}

	# Live NASA DSN Now feed, proxied same-origin and cached so visitors never hit NASA directly.
	location = /api/dsn.xml {
		proxy_pass https://eyes.nasa.gov/dsn/data/dsn.xml;
		proxy_ssl_server_name on;
		proxy_set_header Host eyes.nasa.gov;
		proxy_set_header Cookie "";
		proxy_hide_header Set-Cookie;
		proxy_ignore_headers Cache-Control Expires Set-Cookie;
		proxy_cache voyager_dsn;
		proxy_cache_valid 200 30s;
		proxy_cache_valid any 10s;
		proxy_cache_lock on;
		proxy_cache_use_stale error timeout updating;
		proxy_connect_timeout 5s;
		proxy_read_timeout 10s;
		default_type application/xml;
		add_header Cache-Control "public, max-age=30" always;
		add_header X-Content-Type-Options "nosniff" always;
	}
}
